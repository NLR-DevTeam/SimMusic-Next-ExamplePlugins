<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>歌词 MV</title>
    <!-- /.sim/ 是宿主提供给扩展页面的 SimUI、字体与播放控制，页面其余文件来自扩展目录 -->
    <link rel="stylesheet" href="/.sim/fonts.css">
    <link rel="stylesheet" href="/.sim/simui.css">
    <link rel="stylesheet" href="mv.css">
    <link rel="stylesheet" href="/.sim/runtime.css" id="runtimeCss">
    <script src="/.sim/cssRules.js" defer></script>
    <script src="/.sim/simui.js" defer></script>
    <script src="/.sim/player.js" defer></script>
    <script src="mv.js" defer></script>
</head>
<body class="idle">
    <div id="shot"><div id="camera">
        <div id="backdrop"></div>
        <div id="glowA" class="glow"></div>
        <div id="glowB" class="glow"></div>
        <div id="ringsLeft" class="rings"></div>
        <div id="ringsRight" class="rings"></div>
        <canvas id="particles"></canvas>
        <div id="sweep"></div>
        <div id="ghost"></div>
        <div id="stage"></div>
        <div id="idleCard">
            <div id="disc"><img id="discCover" src="/.sim/assets/placeholder.png"></div>
            <div id="idleText"><b id="idleTitle"></b><span id="idleArtist"></span><div id="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
        </div>
    </div></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="progressLine"></div>
    <header id="topBar">
        <button id="collapseButton" class="barButton windowsIcon" title="收起播放页">&#xEAB4;</button>
        <div id="topTitle"></div>
        <div class="windowButtons">
            <button id="minimizeButton" class="barButton windowsIcon" title="最小化">&#xEABA;</button>
            <button id="maximizeButton" class="barButton windowsIcon" title="最大化 / 还原">&#xEAB9;</button>
            <button id="closeButton" class="barButton windowsIcon closeButton" title="关闭">&#xEAB8;</button>
        </div>
    </header>
    <footer id="controlBar">
        <div class="seekRow"><span id="positionLabel">0:00</span><div id="seekBar" class="progress" min="0" max="1" value="0"></div><span id="durationLabel">0:00</span></div>
        <div class="buttonRow">
            <div class="nowPlaying"><img id="barCover" src="/.sim/assets/placeholder.png"><div><b id="barTitle"></b><span id="barArtist"></span></div></div>
            <div class="transport">
                <button id="modeButton" class="roundButton" title="播放模式"><i>&#xF072;</i></button>
                <button id="previousButton" class="roundButton" title="上一首"><i>&#xF140;</i></button>
                <button id="toggleButton" class="roundButton play" title="播放 / 暂停"><i>&#xF508;</i></button>
                <button id="nextButton" class="roundButton" title="下一首"><i>&#xF144;</i></button>
                <button id="queueButton" class="roundButton" title="播放队列"><i>&#xF011;</i></button>
            </div>
            <div class="side"><button id="muteButton" class="roundButton" title="静音"><i>&#xF2A2;</i></button><div id="volumeBar" class="progress" min="0" max="1" value="0.8"></div><button id="moreButton" class="roundButton" title="更多操作"><i>&#xEF77;</i></button><button id="fullscreenButton" class="roundButton" title="全屏"><svg viewBox="0 0 24 24"><path class="enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="leave" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button></div>
        </div>
    </footer>
    <aside id="queueDrawer"><div id="queueList"></div></aside>
</body>
</html>
